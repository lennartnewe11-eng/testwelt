<text x="10" y="8" font-size="5" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Schnittteile Gr. 86 – Schnittkante = Linie, Naht = gestrichelt, Passzeichen = rote Striche</text><text x="10" y="14" font-size="3.2" font-family="Arial, Helvetica, sans-serif">Single Jersey, Fadenlauf längs. Kugelnaht 214.0 mm, Armlochnaht 208.0 mm, Mehrweite 2.9 %. Ärmelursprung = Ursprung + 320 mm nach rechts. Passzeichen treffen nach dem Nähen aufeinander.</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 730" width="1010" height="730" font-family="Arial, Helvetica, sans-serif" font-size="13">
<rect width="100%" height="100%" fill="#fff"/>
<title>Schnitte durch die Nahtstelle</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2422"/></marker></defs>
<text x="20" y="26" fill="#1c2422" font-size="13" text-anchor="start" font-weight="bold">A – Querschnitt 30 mm vor der Nadel (Blick in Transportrichtung, Höhen 12-fach überhöht)</text><rect x="60" y="250" width="640" height="36" fill="#d9dedb" stroke="#1c2422" /><text x="70" y="274" fill="#3d4a45" font-size="13" text-anchor="start">Tisch / Stichplatte</text><rect x="60" y="228" width="264" height="22" fill="#9aa7b3" stroke="#1c2422" /><text x="70" y="244" fill="#1c2422" font-size="12" text-anchor="start">Träger 1 mm</text><path d="M60,215.9 L320,215.9 L348,237.9 L480,237.9 L480,250 L342,250 L320,228 L60,228 Z" fill="#2a78d6" fill-opacity="0.55" stroke="#2a78d6"/><path d="M60,209.3 L324,209.3 Q396,215.3 498,221.3 L498,227.9 Q396,221.9 324,215.9 L60,215.9 Z" fill="#7a8791" stroke="#1c2422"/><path d="M60,197.20000000000002 L324,197.20000000000002 Q396,203.20000000000002 480,208.20000000000002 L480,220.3 Q396,215.3 324,209.3 L60,209.3 Z" fill="#d98a1f" fill-opacity="0.6" stroke="#d98a1f"/><rect x="60" y="175.20000000000002" width="240" height="22" fill="#f0c9a0" stroke="#1c2422" /><rect x="60" y="141.20000000000002" width="240" height="34" fill="#e7ecea" stroke="#1c2422" /><text x="70" y="163.20000000000002" fill="#1c2422" font-size="13" text-anchor="start">Grundplatte, unten Moosgummi 1 mm</text><path d="M312,161.20000000000002 L462,181.20000000000002 L462,207.20000000000002 Q396,203.20000000000002 312,197.20000000000002 Z" fill="#fbe3df" stroke="#c0392b" stroke-width="1.4"/><circle cx="312" cy="159.20000000000002" r="6" fill="#fff" stroke="#c0392b" stroke-width="1.6"/><path d="M420,60 L420,300" stroke="#c0392b" stroke-width="1" fill="none" stroke-dasharray="5,4"/><text x="426" y="74" fill="#c0392b" font-size="12" text-anchor="start">Nahtlinie = Nadelbahn</text><rect x="366" y="86" width="108" height="26" fill="none" stroke="#c0392b" stroke-dasharray="3,3"/><text x="486" y="104" fill="#c0392b" font-size="12" text-anchor="start">Breite des Nähfußes (18 mm), folgt 14 mm dahinter</text><path d="M324,312 L420,312" stroke="#1c2422" stroke-width="1" fill="none" marker-end="url(#ar)"/><path d="M420,312 L324,312" stroke="#1c2422" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="372" y="328" fill="#1c2422" font-size="12" text-anchor="middle">Schlitz 16</text><path d="M420,312 L480,312" stroke="#1c2422" stroke-width="1" fill="none" marker-end="url(#ar)"/><path d="M480,312 L420,312" stroke="#1c2422" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="450" y="328" fill="#1c2422" font-size="12" text-anchor="middle">Zugabe 10</text><path d="M312,338 L462,338" stroke="#c0392b" stroke-width="1" fill="none" marker-end="url(#ar)"/><path d="M462,338 L312,338" stroke="#c0392b" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="390" y="354" fill="#c0392b" font-size="12" text-anchor="middle">Klappfinger 18 + 7 mm</text><rect x="720" y="150" width="18" height="12" fill="#d98a1f" stroke="#1c2422" /><text x="746" y="161" fill="#1c2422" font-size="12" text-anchor="start">Ärmel 0,55 mm (oben, rechte Seite unten)</text><rect x="720" y="174" width="18" height="12" fill="#7a8791" stroke="#1c2422" /><text x="746" y="185" fill="#1c2422" font-size="12" text-anchor="start">Trennblech 0,3 mm, poliert</text><rect x="720" y="198" width="18" height="12" fill="#2a78d6" stroke="#1c2422" /><text x="746" y="209" fill="#1c2422" font-size="12" text-anchor="start">Körper 0,55 mm (rechte Seite oben)</text><rect x="720" y="222" width="18" height="12" fill="#9aa7b3" stroke="#1c2422" /><text x="746" y="233" fill="#1c2422" font-size="12" text-anchor="start">Werkstückträger 1 mm</text><rect x="720" y="246" width="18" height="12" fill="#fbe3df" stroke="#1c2422" /><text x="746" y="257" fill="#1c2422" font-size="12" text-anchor="start">Klappfinger (Scharnier links)</text><text x="720" y="290" fill="#6b7773" font-size="12" text-anchor="start">Die Platte drückt den Ärmel auf das Trennblech.</text><text x="720" y="306" fill="#6b7773" font-size="12" text-anchor="start">Moosgummi haftet (μ ≈ 0,8), das polierte Blech</text><text x="720" y="322" fill="#6b7773" font-size="12" text-anchor="start">gleitet (μ ≈ 0,15): der Ärmel folgt der Platte,</text><text x="720" y="338" fill="#6b7773" font-size="12" text-anchor="start">der Körper darunter dem Träger.</text><text x="20" y="426" fill="#1c2422" font-size="13" text-anchor="start" font-weight="bold">B – Längsschnitt in der Nahtbahn (Blick von links, Transport nach rechts)</text><rect x="60" y="650" width="900" height="36" fill="#d9dedb" stroke="#1c2422" /><rect x="523.6" y="644" width="72.8" height="10" fill="#8b9792" stroke="#1c2422" /><text x="523.6" y="702" fill="#3d4a45" font-size="12" text-anchor="start">Transporteur</text><rect x="60" y="637.9" width="900" height="12.100000000000001" fill="#2a78d6" stroke="#2a78d6" fill-opacity="0.55"/><path d="M60,611.9 L462.8,611.9 L476.8,618.9 L60,618.9 Z" fill="#7a8791" stroke="#1c2422"/><path d="M60,599.8 L466.8,599.8 C487.2,599.8 492.4,625.8 513.2,625.8 L960,625.8 L960,637.9 L513.2,637.9 C492.4,637.9 492.4,611.9 466.8,611.9 L60,611.9 Z" fill="#d98a1f" fill-opacity="0.6" stroke="#d98a1f"/><rect x="237.59999999999997" y="583.8" width="100" height="16" fill="#fbe3df" stroke="#c0392b" /><rect x="346.79999999999995" y="583.8" width="100" height="16" fill="#fbe3df" stroke="#c0392b" /><path d="M456,595.8 L468,521.8 L482,525.8 L470,599.8 Z" fill="#fbe3df" stroke="#c0392b" stroke-dasharray="4,3"/><text x="237.59999999999997" y="575.8" fill="#c0392b" font-size="12" text-anchor="start">Finger liegen auf</text><text x="426" y="513.8" fill="#c0392b" font-size="12" text-anchor="start">hochgeklappt</text><path d="M476.8,623.8 L497.6,611.8 L544.4,611.8 L544.4,515.8 L575.6,515.8 L575.6,611.8 L643.2,611.8 L643.2,623.8 Z" fill="#eef1ef" stroke="#3d4a45" stroke-width="1.4"/><path d="M560,455.79999999999995 L560,664" stroke="#1c2422" stroke-width="2" fill="none"/><text x="568" y="475.79999999999995" fill="#1c2422" font-size="12" text-anchor="start">Nadel</text><text x="653.6" y="565.8" fill="#3d4a45" font-size="12" text-anchor="start">Nähfuß (PTFE)</text><path d="M580.8,625.8 L580.8,650" stroke="#c0392b" stroke-width="1.2" fill="none"/><path d="M601.6,625.8 L601.6,650" stroke="#c0392b" stroke-width="1.2" fill="none"/><path d="M622.4,625.8 L622.4,650" stroke="#c0392b" stroke-width="1.2" fill="none"/><path d="M643.2,625.8 L643.2,650" stroke="#c0392b" stroke-width="1.2" fill="none"/><path d="M664,625.8 L664,650" stroke="#c0392b" stroke-width="1.2" fill="none"/><path d="M684.8,625.8 L684.8,650" stroke="#c0392b" stroke-width="1.2" fill="none"/><path d="M705.6,625.8 L705.6,650" stroke="#c0392b" stroke-width="1.2" fill="none"/><path d="M726.4,625.8 L726.4,650" stroke="#c0392b" stroke-width="1.2" fill="none"/><path d="M747.2,625.8 L747.2,650" stroke="#c0392b" stroke-width="1.2" fill="none"/><path d="M768,625.8 L768,650" stroke="#c0392b" stroke-width="1.2" fill="none"/><path d="M788.8,625.8 L788.8,650" stroke="#c0392b" stroke-width="1.2" fill="none"/><path d="M809.6,625.8 L809.6,650" stroke="#c0392b" stroke-width="1.2" fill="none"/><text x="768" y="615.8" fill="#c0392b" font-size="12" text-anchor="start">vernäht</text><path d="M466.4,460 L466.4,710" stroke="#c0392b" stroke-width="1" fill="none" stroke-dasharray="3,3"/><text x="460.4" y="456" fill="#c0392b" font-size="12" text-anchor="end">Freigabelinie −18 mm</text><path d="M476.8,478 L476.8,694" stroke="#7a8791" stroke-width="1" fill="none" stroke-dasharray="3,3"/><text x="482.8" y="694" fill="#4f5b63" font-size="12" text-anchor="start">Blechkante −16 mm</text><path d="M700,460 L800,460" stroke="#1c2422" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="700" y="452" fill="#1c2422" font-size="12" text-anchor="start">Transportrichtung</text><text x="70" y="633.9" fill="#1c2422" font-size="12" text-anchor="start">Trennblech</text><text x="70" y="551.8" fill="#d98a1f" font-size="12" text-anchor="start">Ärmel: von Platte und Fingern geführt</text><text x="70" y="667.9" fill="#2a78d6" font-size="12" text-anchor="start">Körper liegt hier auf der Stichplatte (Schlitz im Träger)</text>
</svg>

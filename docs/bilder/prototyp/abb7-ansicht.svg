<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" width="1020" height="470" font-family="Arial, Helvetica, sans-serif" font-size="13">
<rect width="100%" height="100%" fill="#fff"/>
<title>Portal und Zuführung von vorn</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2422"/></marker></defs>
<text x="20" y="26" fill="#1c2422" font-size="13" text-anchor="start" font-weight="bold">Ansicht von vorn (Bedienerseite), nicht maßstäblich</text><rect x="40" y="430" width="930" height="22" fill="#d9dedb" stroke="#1c2422" /><text x="50" y="446" fill="#3d4a45" font-size="12" text-anchor="start">Gleitfläche, bündig mit dem Maschinenbett</text><rect x="560" y="280" width="250" height="52" fill="#cfd8d3" stroke="#3d4a45" /><rect x="790" y="280" width="70" height="150" fill="#b4c0ba" stroke="#3d4a45" /><rect x="520" y="260" width="80" height="130" fill="#dfe6e2" stroke="#3d4a45" /><path d="M560,390 L560,426" stroke="#1c2422" stroke-width="2" fill="none"/><rect x="548" y="418" width="24" height="8" fill="#fff" stroke="#c0392b" /><text x="610" y="310" fill="#3d4a45" font-size="13" text-anchor="start">A6000</text><text x="798" y="360" fill="#3d4a45" font-size="12" text-anchor="start">Ständer</text><path d="M470,240 L540,270" stroke="#6b7773" stroke-width="0.8" fill="none"/><text x="466" y="244" fill="#1c2422" font-size="12" text-anchor="end">Nähkopf ≈ 200 mm hoch</text><rect x="150" y="425" width="560" height="5" fill="#9aa7b3" stroke="#1c2422" /><rect x="170" y="420" width="400" height="5" fill="#2a78d6" stroke="#2a78d6" fill-opacity="0.6"/><rect x="330" y="414" width="240" height="4" fill="#7a8791" stroke="#1c2422" /><rect x="360" y="408" width="200" height="5" fill="#d98a1f" stroke="#d98a1f" fill-opacity="0.7"/><rect x="370" y="394" width="150" height="14" fill="#e7ecea" stroke="#1c2422" /><rect x="522" y="394" width="34" height="14" fill="#fbe3df" stroke="#c0392b" /><rect x="410" y="334" width="44" height="60" fill="#3a4a55" stroke="#1c2422" /><text x="432" y="368" fill="#fff" font-size="13" text-anchor="middle">θ</text><rect x="80" y="312" width="380" height="22" fill="#1a8f4a" stroke="#1c2422" fill-opacity="0.35"/><rect x="60" y="220" width="90" height="92" fill="#e7ecea" stroke="#1c2422" /><text x="72" y="260" fill="#1c2422" font-size="13" text-anchor="start" font-weight="bold">X-Y</text><text x="72" y="278" fill="#1c2422" font-size="12" text-anchor="start">Zuführung</text><text x="170" y="306" fill="#1a8f4a" font-size="12" text-anchor="start">Ausleger, Z-Hub 30 mm an der Lagerung</text><path d="M60,312 L60,430" stroke="#1c2422" stroke-width="3" fill="none"/><path d="M150,312 L150,430" stroke="#1c2422" stroke-width="1" fill="none"/><rect x="30" y="70" width="16" height="360" fill="#c3c9cf" stroke="#1c2422" /><rect x="960" y="70" width="16" height="360" fill="#c3c9cf" stroke="#1c2422" /><rect x="30" y="62" width="946" height="22" fill="#c3c9cf" stroke="#1c2422" /><text x="60" y="56" fill="#1c2422" font-size="12" text-anchor="start">Portalgestell (eigenes Gestell, Aluprofil 40×80), Brücke ≥ 450 mm über dem Tisch</text><rect x="600" y="84" width="120" height="46" fill="#e7ecea" stroke="#1c2422" /><text x="612" y="112" fill="#1c2422" font-size="13" text-anchor="start" font-weight="bold">X-Y Portal</text><rect x="640" y="130" width="40" height="60" fill="#3a4a55" stroke="#1c2422" /><text x="660" y="166" fill="#fff" font-size="13" text-anchor="middle">C</text><rect x="652" y="190" width="16" height="214" fill="#9aa7b3" stroke="#1c2422" /><rect x="636" y="404" width="48" height="18" fill="#c0392b" stroke="#1c2422" fill-opacity="0.5"/><rect x="610" y="422" width="100" height="4" fill="#9aa7b3" stroke="#1c2422" /><path d="M730,250 L668,280" stroke="#6b7773" stroke-width="0.8" fill="none"/><text x="734" y="254" fill="#1c2422" font-size="12" text-anchor="start">Z-Säule Ø ≤ 60 mm, läuft hinter dem Arm</text><path d="M730,390 L690,412" stroke="#6b7773" stroke-width="0.8" fill="none"/><text x="734" y="394" fill="#1c2422" font-size="12" text-anchor="start">Kupplung auf der Trägerlasche</text><path d="M250,370 L380,400" stroke="#6b7773" stroke-width="0.8" fill="none"/><text x="246" y="374" fill="#1c2422" font-size="12" text-anchor="end">Grundplatte, Klappfinger</text><path d="M250,390 L340,415" stroke="#6b7773" stroke-width="0.8" fill="none"/><text x="246" y="394" fill="#1c2422" font-size="12" text-anchor="end">Trennblech (Halter von vorn oben)</text><path d="M1000,62 L1000,430" stroke="#1c2422" stroke-width="1" fill="none" marker-end="url(#ar)"/><path d="M1000,430 L1000,62" stroke="#1c2422" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="992" y="250" fill="#1c2422" font-size="12" text-anchor="end">≥ 450</text>
</svg>

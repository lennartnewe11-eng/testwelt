<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 440" width="1010" height="440" font-family="Arial, Helvetica, sans-serif" font-size="13">
<rect width="100%" height="100%" fill="#fff"/>
<title>Klappfinger mit Mikroservo</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2422"/></marker></defs>
<text x="20" y="26" fill="#1c2422" font-size="13" text-anchor="start" font-weight="bold">Klappfinger – Seitenansicht quer zur Naht (nicht maßstäblich)</text><rect x="40" y="322" width="620" height="14" fill="#7a8791" stroke="#1c2422" /><rect x="40" y="300" width="500" height="22" fill="#d98a1f" stroke="#d98a1f" fill-opacity="0.6"/><text x="48" y="316" fill="#1c2422" font-size="12" text-anchor="start">Ärmel</text><text x="48" y="352" fill="#1c2422" font-size="12" text-anchor="start">Trennblech</text><rect x="40" y="254" width="280" height="34" fill="#e7ecea" stroke="#1c2422" /><rect x="40" y="288" width="280" height="12" fill="#f0c9a0" stroke="#1c2422" /><text x="52" y="276" fill="#1c2422" font-size="13" text-anchor="start">Grundplatte 6 mm (PETG/Alu)</text><text x="52" y="240" fill="#6b7773" font-size="12" text-anchor="start">Moosgummi 1 mm</text><circle cx="336" cy="270" r="9" fill="#fff" stroke="#c0392b" stroke-width="2"/><circle cx="336" cy="270" r="2.5" fill="#c0392b"/><path d="M316,110 L336,260" stroke="#6b7773" stroke-width="0.8" fill="none"/><text x="312" y="114" fill="#1c2422" font-size="12" text-anchor="end">Scharnierstift Ø 2 mm, 18 mm neben der Naht</text><path d="M342,262 L486,278 L486,292 L342,292 Z" fill="#fbe3df" stroke="#c0392b" stroke-width="1.5"/><rect x="344" y="292" width="142" height="8" fill="#f0c9a0" stroke="#1c2422" /><text x="366" y="266" fill="#c0392b" font-size="12" text-anchor="start">Finger (liegt auf)</text><path d="M330,264 L330,120 L350,120 L358,264 Z" fill="none" stroke="#c0392b" stroke-dasharray="5,4" stroke-width="1.5"/><text x="362" y="150" fill="#c0392b" font-size="12" text-anchor="start">hochgeklappt (≥ 85°)</text><path d="M456,240 A120,120 0 0 0 366,152" fill="none" stroke="#c0392b" marker-end="url(#ar)"/><rect x="150" y="190" width="86" height="64" fill="#3a4a55" stroke="#1c2422" /><text x="158" y="218" fill="#fff" font-size="12" text-anchor="start">Mikroservo</text><text x="158" y="234" fill="#fff" font-size="12" text-anchor="start">9 g</text><circle cx="236" cy="204" r="8" fill="#fff" stroke="#1c2422"/><path d="M236,204 L268,176" stroke="#1c2422" stroke-width="3" fill="none"/><path d="M268,176 L340,218" stroke="#1c2422" stroke-width="1.6" fill="none"/><circle cx="340" cy="218" r="3" fill="#1c2422"/><path d="M300,150 L268,176" stroke="#6b7773" stroke-width="0.8" fill="none"/><text x="296" y="154" fill="#1c2422" font-size="12" text-anchor="end">Servohebel und Gestänge (Federstahl 1 mm)</text><path d="M444,70 L444,346" stroke="#c0392b" stroke-width="1" fill="none" stroke-dasharray="5,4"/><text x="450" y="84" fill="#c0392b" font-size="12" text-anchor="start">Nahtlinie</text><rect x="390" y="360" width="108" height="14" fill="none" stroke="#c0392b" stroke-dasharray="3,3"/><text x="504" y="372" fill="#c0392b" font-size="12" text-anchor="start">Bereich des Nähfußes</text><path d="M336,396 L444,396" stroke="#1c2422" stroke-width="1" fill="none" marker-end="url(#ar)"/><path d="M444,396 L336,396" stroke="#1c2422" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="390" y="414" fill="#1c2422" font-size="12" text-anchor="middle">18 mm</text><path d="M444,396 L486,396" stroke="#1c2422" stroke-width="1" fill="none" marker-end="url(#ar)"/><path d="M486,396 L444,396" stroke="#1c2422" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="466" y="414" fill="#1c2422" font-size="12" text-anchor="middle">7</text><text x="700" y="120" fill="#1c2422" font-size="13" text-anchor="start" font-weight="bold">Ablauf</text><text x="700" y="144" fill="#1c2422" font-size="12" text-anchor="start">1  Finger liegt auf: Ärmelkante wird bis</text><text x="700" y="162" fill="#1c2422" font-size="12" text-anchor="start">   an die Naht geführt.</text><text x="700" y="180" fill="#1c2422" font-size="12" text-anchor="start">2  Vorderes Fingerende erreicht die</text><text x="700" y="198" fill="#1c2422" font-size="12" text-anchor="start">   Freigabelinie (18 mm vor der Nadel).</text><text x="700" y="216" fill="#1c2422" font-size="12" text-anchor="start">3  Servo klappt den Finger hoch – er steht</text><text x="700" y="234" fill="#1c2422" font-size="12" text-anchor="start">   jetzt 18 mm links der Naht und läuft</text><text x="700" y="252" fill="#1c2422" font-size="12" text-anchor="start">   neben dem Nähfuß vorbei.</text><text x="700" y="270" fill="#1c2422" font-size="12" text-anchor="start">4  Der Ärmel fällt hinter der Blechkante</text><text x="700" y="288" fill="#1c2422" font-size="12" text-anchor="start">   auf den Körper und wird vernäht.</text>
</svg>
